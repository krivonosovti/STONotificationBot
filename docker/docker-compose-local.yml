name: andryukha-local
services:
  postgres:
    image: postgres:16.11-alpine
    ports: [127.0.0.1:5433:5432]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend, local-access]
    mem_limit: 512m
  prometheus:
    image: prom/prometheus:v3.5.0
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: [127.0.0.1:9091:9090]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=15d]
    volumes:
      - ./monitoring/prometheus/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [monitoring]
    mem_limit: 384m
  grafana:
    image: grafana/grafana:12.3.1
    ports: [127.0.0.1:3000:3000]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?Set GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [monitoring]
    mem_limit: 256m
  tests:
    profiles: [test]
    image: gradle:8.14.3-jdk21
    working_dir: /workspace
    command: [./gradlew, --no-daemon, test, integrationTest]
    volumes:
      - ..:/workspace
      - gradle-cache:/home/gradle/.gradle
    environment:
      TEST_DB_URL: jdbc:postgresql://test-postgres:5432/andryukha_test
      TEST_DB_USER: test
      TEST_DB_PASSWORD: test-only-password
    depends_on:
      test-postgres:
        condition: service_healthy
    networks: [backend, monitoring]
  test-postgres:
    profiles: [test]
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: andryukha_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-password
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U test -d andryukha_test]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

volumes:
  gradle-cache:
  postgres-data:
  prometheus-data:
  grafana-data:
networks:
  local-access:
  backend:
    internal: true
  monitoring:
